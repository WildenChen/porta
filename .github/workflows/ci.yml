name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - ".github/workflows/ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/proxy/src/**"
      - "packages/proxy/package.json"
      - "packages/proxy/tsconfig.json"
      - "packages/proxy/vitest.config.ts"
      - "packages/web/src/**"
      - "packages/web/public/**"
      - "packages/web/index.html"
      - "packages/web/package.json"
      - "packages/web/e2e/**"
      - "packages/web/tsconfig*.json"
      - "packages/web/vite.config.ts"
      - "packages/web/vitest.config.ts"
      - "packages/web/vitest.e2e.config.ts"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/proxy/src/**"
      - "packages/proxy/package.json"
      - "packages/proxy/tsconfig.json"
      - "packages/proxy/vitest.config.ts"
      - "packages/web/src/**"
      - "packages/web/public/**"
      - "packages/web/index.html"
      - "packages/web/package.json"
      - "packages/web/e2e/**"
      - "packages/web/tsconfig*.json"
      - "packages/web/vite.config.ts"
      - "packages/web/vitest.config.ts"
      - "packages/web/vitest.e2e.config.ts"
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          pnpm test 2>&1 | tee "test-results/unit-${{ matrix.os }}.log"

      - name: Upload unit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-${{ matrix.os }}
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run E2E
        shell: bash
        run: |
          mkdir -p test-results
          set -o pipefail
          pnpm test:e2e 2>&1 | tee test-results/e2e.log

      - name: Upload E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          path: |
            test-results/
            packages/web/test-results/
            packages/web/playwright-report/
          if-no-files-found: warn
          retention-days: 14
