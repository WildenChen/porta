name: Agent Issue 1 README Sync

on:
  push:
    branches:
      - agent/issue-1-readme-sync
    paths:
      - .github/workflows/agent-issue-1-readme-sync.yml

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-1-readme-sync
          fetch-depth: 0

      - name: Synchronize README
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          replacements = {
              "https://github.com/L1M80/porta/actions/workflows/ci.yml/badge.svg": "https://github.com/WildenChen/porta/actions/workflows/ci.yml/badge.svg",
              "https://github.com/L1M80/porta/actions/workflows/ci.yml": "https://github.com/WildenChen/porta/actions/workflows/ci.yml",
              "0.13.0%2Bwilden.03": "0.13.0%2Bwilden.04",
              "0.13.0+wilden.03": "0.13.0+wilden.04",
              "git clone https://github.com/L1M80/porta.git": "git clone https://github.com/WildenChen/porta.git",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected README text not found: {old}")
              text = text.replace(old, new)
          path.write_text(text)
          PY

      - name: Remove one-time workflow and commit
        run: |
          rm .github/workflows/agent-issue-1-readme-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/agent-issue-1-readme-sync.yml
          git commit -m "docs: synchronize README with Wilden build 0.13.0+wilden.04"
          git push origin HEAD:agent/issue-1-readme-sync
